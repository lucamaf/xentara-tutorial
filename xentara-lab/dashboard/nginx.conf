# nginx for the dashboard: static files only, runs as an unprivileged user on port 8080
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 64; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;

    # an unprivileged user cannot write to the default locations
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080 default_server;
        listen [::]:8080 default_server;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        # the page loads its own scripts only, and may connect to Xentara (https and wss on any host and port)
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https: wss:; img-src 'self' data:; style-src 'self'; script-src 'self'; frame-ancestors 'none'" always;

        # NOTE: nginx only inherits add_header from the server level into locations that have no add_header of their own,
        # so all headers are set here and the locations below must not add any
        add_header Cache-Control "no-cache" always;

        location / {
            try_files $uri $uri/ =404;
        }

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
